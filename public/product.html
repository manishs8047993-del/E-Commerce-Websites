<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details — NovaStore</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="navbar-root"></div>

  <main class="container">
    <!-- Breadcrumb -->
    <div style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.5rem;">
      <a href="/index.html" style="color: var(--primary);"><i class="fas fa-home"></i> Home</a>
      <i class="fas fa-chevron-right" style="font-size: 0.7rem;"></i>
      <span id="breadcrumb-category">Products</span>
      <i class="fas fa-chevron-right" style="font-size: 0.7rem;"></i>
      <span id="breadcrumb-title" style="color: var(--text-main); font-weight: 600;">Loading...</span>
    </div>

    <!-- Product Detail Container -->
    <div id="product-detail-root">
      <div style="text-align: center; padding: 5rem 0;">
        <i class="fas fa-circle-notch fa-spin" style="font-size: 3rem; color: var(--primary);"></i>
        <p style="margin-top: 1rem; color: var(--text-muted);">Loading product details...</p>
      </div>
    </div>

    <!-- Reviews & Customer Ratings Section -->
    <section id="reviews-section" style="margin-bottom: 4rem;">
      <!-- Dynamic Reviews Loaded Here -->
    </section>

    <!-- Related Products Section -->
    <section id="related-section" style="margin-bottom: 4rem;">
      <!-- Dynamic Related Products Loaded Here -->
    </section>
  </main>

  <div id="footer-root"></div>

  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
