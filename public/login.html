<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Register — NovaStore</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);">

  <div id="navbar-root"></div>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="nav-brand" style="justify-content: center; margin-bottom: 0.5rem;">
          <i class="fas fa-shopping-bag"></i>
          <span>Nova<b>Store</b></span>
        </div>
        <p style="color: var(--text-muted); font-size: 0.95rem;" id="auth-subtitle">Welcome back! Please sign in to your account.</p>
      </div>

      <!-- Tab Switcher (Sign In / Register) -->
      <div class="auth-tabs">
        <div class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </div>
        <div class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">
          <i class="fas fa-user-plus"></i> Register
        </div>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">


        <div class="form-group">
          <label class="form-label" id="loginEmailLabel">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('loginPassword', this)" title="Show/Hide Password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
          <i class="fas fa-arrow-right"></i> Sign In to NovaStore
        </button>

        <div style="margin-top: 1.25rem; text-align: center;">
          <span style="color: var(--text-muted); font-size: 0.85rem;">Don't have an account?</span>
          <button type="button" onclick="switchAuthTab('register')" style="background: none; border: none; color: var(--primary); font-weight: 700; cursor: pointer; font-size: 0.85rem; margin-left: 0.35rem;">Register here</button>
        </div>      </form>

      <!-- Register Form -->
      <form id="registerForm" style="display: none;" onsubmit="handleRegister(event)">


        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input type="text" id="regName" class="form-control" placeholder="John Doe" required autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label">Email Address *</label>
          <input type="email" id="regEmail" class="form-control" placeholder="name@example.com" required autocomplete="email">
        </div>

        <!-- Strong Password Field -->
        <div class="form-group">
          <label class="form-label">Password (Strong Password Required) *</label>
          <div class="password-input-wrapper">
            <input type="password" id="regPassword" class="form-control" placeholder="Create strong password" required oninput="validatePasswordStrength()" autocomplete="new-password">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('regPassword', this)" title="Show/Hide Password">
              <i class="fas fa-eye"></i>
            </button>
          </div>

          <!-- Live Strength Meter -->
          <div class="password-strength-container" id="strengthMeterContainer" style="display: none;">
            <div class="strength-bar-track">
              <div class="strength-bar-fill" id="strengthBarFill"></div>
            </div>
            <div class="strength-text">
              <span>Password Strength:</span>
              <span id="strengthLabel" style="font-weight: 800;">Too Weak</span>
            </div>
          </div>

          <!-- Interactive Requirements Checklist -->
          <ul class="password-checklist" id="passwordChecklist">
            <li class="checklist-item invalid" id="rule-length">
              <i class="fas fa-circle"></i> 8+ characters
            </li>
            <li class="checklist-item invalid" id="rule-uppercase">
              <i class="fas fa-circle"></i> 1 uppercase (A-Z)
            </li>
            <li class="checklist-item invalid" id="rule-lowercase">
              <i class="fas fa-circle"></i> 1 lowercase (a-z)
            </li>
            <li class="checklist-item invalid" id="rule-number">
              <i class="fas fa-circle"></i> 1 number (0-9)
            </li>
            <li class="checklist-item invalid" id="rule-special" style="grid-column: 1 / -1;">
              <i class="fas fa-circle"></i> 1 special symbol (@, #, $, %, !, &, *, etc.)
            </li>
          </ul>
        </div>

        <!-- Confirm Password Field -->
        <div class="form-group">
          <label class="form-label">Confirm Password *</label>
          <div class="password-input-wrapper">
            <input type="password" id="regConfirmPassword" class="form-control" placeholder="Re-enter your password" required oninput="validatePasswordMatch()" autocomplete="new-password">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('regConfirmPassword', this)" title="Show/Hide Password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <div id="passwordMatchFeedback" class="password-match-badge" style="display: none;"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" id="regPhone" class="form-control" placeholder="+1 555-0199" autocomplete="tel">
        </div>

        <div class="form-group" id="addressGroup">
          <label class="form-label">Delivery Street Address</label>
          <input type="text" id="regAddress" class="form-control" placeholder="123 Tech Street, Apt 4B">
        </div>

        <div class="form-row" id="cityStateGroup">
          <div class="form-group">
            <label class="form-label">City</label>
            <input type="text" id="regCity" class="form-control" placeholder="San Jose">
          </div>
          <div class="form-group">
            <label class="form-label">State</label>
            <input type="text" id="regState" class="form-control" placeholder="CA">
          </div>
          <div class="form-group">
            <label class="form-label">Zip Code</label>
            <input type="text" id="regPostalCode" class="form-control" placeholder="95113">
          </div>
        </div>

        <button type="submit" id="regSubmitBtn" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
          <i class="fas fa-user-plus"></i> Create Customer Account
        </button>

        <div style="margin-top: 1.25rem; text-align: center;">
          <span style="color: var(--text-muted); font-size: 0.85rem;">Already have an account?</span>
          <button type="button" onclick="switchAuthTab('login')" style="background: none; border: none; color: var(--primary); font-weight: 700; cursor: pointer; font-size: 0.85rem; margin-left: 0.35rem;">Sign In</button>
        </div>
      </form>
    </div>
  </main>

  <div id="footer-root"></div>

  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
