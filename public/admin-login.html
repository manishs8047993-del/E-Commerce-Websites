<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Management & Staff Portal — NovaStore</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .management-auth-wrapper {
      min-height: 100vh;
      background: radial-gradient(circle at 10% 20%, #1e1b4b 0%, #0f172a 90%);
      display: flex;
      flex-direction: column;
    }
    .mgmt-card {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(16px);
      border-radius: var(--radius-xl);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(99, 102, 241, 0.2);
      padding: 2.75rem 2.5rem;
      max-width: 480px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }
    .mgmt-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, #4f46e5, #06b6d4, #10b981);
    }
    .role-pills-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      background: #f1f5f9;
      padding: 0.35rem;
      border-radius: var(--radius-md);
      margin-bottom: 1.5rem;
    }
    .role-pill-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.6rem 0.5rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 700;
      border: none;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      transition: var(--transition);
    }
    .role-pill-btn.active {
      background: #ffffff;
      color: #1e1b4b;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .security-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: #64748b;
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border-light);
    }
  </style>
</head>
<body class="management-auth-wrapper">

  <div id="navbar-root"></div>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2.5rem 1rem;">
    <div class="mgmt-card">
      <div style="text-align: center; margin-bottom: 1.75rem;">
        <div style="display: inline-flex; align-items: center; gap: 0.4rem; background: rgba(79, 70, 229, 0.1); color: #4f46e5; font-size: 0.8rem; font-weight: 800; padding: 0.35rem 0.85rem; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem;">
          <i class="fas fa-shield-alt"></i> Management Portal
        </div>
        <h1 style="font-size: 1.75rem; font-weight: 800; color: #0f172a; margin: 0 0 0.35rem 0;">Staff & Admin Sign In</h1>
        <p style="color: var(--text-muted); font-size: 0.88rem; margin: 0;">Authorized access for store administrators & logistics personnel</p>
      </div>

      <!-- Quick Role Selector Tabs -->
      <div class="role-pills-wrap">
        <button type="button" class="role-pill-btn active" id="roleBtnAdmin" onclick="selectLoginRole('admin')">
          <i class="fas fa-crown" style="color: #4f46e5;"></i> Administrator
        </button>
        <button type="button" class="role-pill-btn" id="roleBtnDelivery" onclick="selectLoginRole('delivery')">
          <i class="fas fa-truck" style="color: #059669;"></i> Delivery Staff
        </button>
      </div>

      <form id="adminLoginForm" onsubmit="handleManagementLogin(event)">
        <div class="form-group">
          <label class="form-label" style="font-weight: 700; font-size: 0.88rem;" id="emailFieldLabel">Staff Email Address *</label>
          <div style="position: relative;">
            <input type="email" id="adminEmail" class="form-control" placeholder="admin@ecommerce.com" required autocomplete="email" style="padding-left: 2.5rem;">
            <i class="fas fa-envelope" style="position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" style="font-weight: 700; font-size: 0.88rem;">Password *</label>
          <div class="password-input-wrapper">
            <input type="password" id="adminPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password" style="padding-left: 2.5rem;">
            <i class="fas fa-lock" style="position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); z-index: 2;"></i>
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('adminPassword', this)" title="Show/Hide Password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Quick Demo Credentials Box -->
        <div id="demoCredentialsBox" style="background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: var(--radius-md); padding: 0.75rem 1rem; margin: 1rem 0; display: flex; justify-content: space-between; align-items: center;">
          <div>
            <div style="font-size: 0.75rem; font-weight: 800; color: #334155;" id="demoBoxTitle">👑 Demo Administrator:</div>
            <div style="font-size: 0.75rem; color: #64748b; font-family: monospace;" id="demoBoxCreds">admin@ecommerce.com / admin123</div>
          </div>
          <button type="button" onclick="autoFillSelectedRole()" class="btn btn-secondary btn-sm" style="font-size: 0.75rem; padding: 0.35rem 0.7rem; font-weight: 700;">
            Auto-fill
          </button>
        </div>

        <button type="submit" id="adminSubmitBtn" class="btn btn-primary btn-block btn-lg" style="background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%); border: none; margin-top: 1rem; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);">
          <i class="fas fa-lock-open"></i> Secure Management Sign In
        </button>

        <div class="security-badge">
          <i class="fas fa-lock" style="color: #10b981;"></i>
          <span>256-Bit Encrypted &bull; Role-Based Access Control</span>
        </div>
      </form>
    </div>
  </main>

  <div id="footer-root"></div>

  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    let activeRole = 'admin';

    function selectLoginRole(role) {
      activeRole = role;
      const btnAdmin = document.getElementById('roleBtnAdmin');
      const btnDelivery = document.getElementById('roleBtnDelivery');
      const boxTitle = document.getElementById('demoBoxTitle');
      const boxCreds = document.getElementById('demoBoxCreds');

      if (role === 'admin') {
        btnAdmin.classList.add('active');
        btnDelivery.classList.remove('active');
        boxTitle.textContent = '👑 Demo Administrator:';
        boxCreds.textContent = 'admin@ecommerce.com / admin123';
        document.getElementById('adminEmail').placeholder = 'admin@ecommerce.com';
      } else {
        btnDelivery.classList.add('active');
        btnAdmin.classList.remove('active');
        boxTitle.textContent = '🚚 Demo Delivery Agent:';
        boxCreds.textContent = 'david.delivery@ecommerce.com / deliverypass123';
        document.getElementById('adminEmail').placeholder = 'david.delivery@ecommerce.com';
      }
      autoFillSelectedRole();
    }

    function autoFillSelectedRole() {
      if (activeRole === 'admin') {
        document.getElementById('adminEmail').value = 'admin@ecommerce.com';
        document.getElementById('adminPassword').value = 'admin123';
        showToast('Administrator credentials populated!', 'info');
      } else {
        document.getElementById('adminEmail').value = 'david.delivery@ecommerce.com';
        document.getElementById('adminPassword').value = 'deliverypass123';
        showToast('Delivery Agent credentials populated!', 'info');
      }
    }

    function togglePasswordVisibility(fieldId, btn) {
      const input = document.getElementById(fieldId);
      if (!input) return;
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      const icon = btn.querySelector('i');
      if (icon) {
        icon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
      }
    }

    async function handleManagementLogin(e) {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;
      const submitBtn = document.getElementById('adminSubmitBtn');

      if (!email || !password) {
        showToast('Please enter both email and password.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Verifying Authorization...';

      try {
        const res = await API.post('/auth/admin-login', { email, password });
        if (res.token && res.user) {
          API.setToken(res.token);
          API.setUser(res.user);

          const roleName = res.user.role === 'admin' ? 'Administrator' : 'Delivery Staff';
          showToast(`Access Granted! Welcome ${res.user.name} (${roleName})`, 'success');

          setTimeout(() => {
            if (res.user.role === 'delivery_agent') {
              window.location.href = '/admin.html?tab=orders';
            } else {
              window.location.href = '/admin.html';
            }
          }, 800);
        }
      } catch (err) {
        showToast(err.message || 'Authentication failed. Please check credentials.', 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-lock-open"></i> Secure Management Sign In';
      }
    }
  </script>
</body>
</html>
