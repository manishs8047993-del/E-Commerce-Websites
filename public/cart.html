<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Shopping Cart — NovaStore</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="navbar-root"></div>

  <main class="container">
    <div style="margin: 2rem 0 1rem 0;">
      <h1 style="font-size: 2.2rem; font-weight: 800;">Shopping Cart</h1>
      <p style="color: var(--text-muted);">Review your selected items before proceeding to checkout.</p>
    </div>

    <div id="cart-root">
      <div style="text-align: center; padding: 5rem 0;">
        <i class="fas fa-circle-notch fa-spin" style="font-size: 2.5rem; color: var(--primary);"></i>
        <p style="margin-top: 1rem; color: var(--text-muted);">Loading cart contents...</p>
      </div>
    </div>
  </main>

  <div id="footer-root"></div>

  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
